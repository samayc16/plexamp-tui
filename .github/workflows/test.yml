name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 ships mpv 0.37: the path for mpv older than 0.38
        os: [ubuntu-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: mpv
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -yq mpv; else brew install mpv; fi
          mpv --version | head -n 1
      - uses: astral-sh/setup-uv@v6
      - name: tests
        run: |
          uv venv --python 3.12
          uv pip install -e '.[test]'
          .venv/bin/pytest -q
      - name: lint
        run: uvx ruff check src tests && uvx ruff format --check src tests

  # After every test passes: a push to main refreshes the rolling `edge` pre-release, and a
  # version tag (v1.2.3) publishes that release. Both carry the wheel and the source package.
  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: build
        run: uv build
      - name: the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          else
            gh release delete edge --yes --cleanup-tag 2>/dev/null || true
            gh release create edge dist/* --prerelease --target "$GITHUB_SHA" --title "edge (latest main)" \
              --notes "Built from ${GITHUB_SHA::7}, which passed every test on macOS and Ubuntu. Replaced on every push to main; for a fixed version, use a numbered release."
          fi
