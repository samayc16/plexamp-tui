[project]
name = "tamp"
version = "0.1.0"
description = "A keyboard-driven Plex music player for the terminal: local gapless playback or remote control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=8.2",
  "plexapi>=4.18",
  "qrcode>=8.2",
  "pillow>=11",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
tamp = "tamp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
